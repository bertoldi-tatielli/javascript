<body>

    <script>
       var n1 = window.prompt('Digite um número:') // String
       var n2 = window.prompt('Digite outro número:') // String
    var resultado = Number(n1) + Number(n2) // Vai converter os números para o tipo numérico e somá-los
        window.alert('O resultado da soma é: ' + resultado) // Vai mostrar o resultado da soma

    </script>
