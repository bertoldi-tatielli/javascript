<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Primeiros passos de DOM</title>
    <style>
        body {
            background: rgb(68, 125, 199);
            color: white;
            font: normal 1em Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Primeiros passos de DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript</p>
    <div id="msg">Clique em mim</div>
    <script>
        var corpo = window.document.body // Vai pegar o corpo do documento
        var p1 = window.document.getElementsByTagName('p')[1] // Vai pegar o primeiro parágrafo
        
        /*
        var d = window.document.getElementById('msg')
        d.style.background = 'green' // Vai pegar o elemento com id 'msg' e mudar a cor de fundo para verde
        d.innerText = 'Estou aguardando...'
        */
       var d = window.document.querySelector('div#msg') // Vai pegar o primeiro elemento div
       d.style.background = 'blue' // Vai mudar a cor de fundo para azul
    </script>
