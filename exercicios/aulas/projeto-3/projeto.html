<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Contador</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- Folhas que caem -->
    <div id="folhas" aria-hidden="true"></div>


    <!-- Título -->
    <header>

        <div class="placa-titulo">

            <h1>Vamos contar</h1>

        </div>

    </header>


    <!-- Calculadora -->
    <section>

        <div id="dados">

            <p>
                <label for="txti">Início:</label>

                <input
                    type="number"
                    name="inicio"
                    id="txti"
                >
            </p>


            <p>
                <label for="txtf">Fim:</label>

                <input
                    type="number"
                    name="fim"
                    id="txtf"
                >
            </p>


            <p>
                <label for="txtp">Passo:</label>

                <input
                    type="number"
                    name="passo"
                    id="txtp"
                >
            </p>


            <p>
                <input
                    type="button"
                    value="Contar"
                    onclick="contar()"
                >
            </p>

        </div>


        <div id="res">
            Preparando a contagem...
        </div>

    </section>


    <footer>
        <p>&copy; Tatielli Bertoldi</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
